# Paquet Home Assistant de la caméra du placard. Projet complet : CAMERA_PLACARD/CAMERA_PLACARD.md.
#
# Installation :
#   1. configuration.yaml :  homeassistant: { packages: !include_dir_named packages }
#   2. Copier ce fichier dans /config/packages/camera_placard.yaml.
#   3. secrets.yaml : compreface_cle_api (clé du service « Recognition » de CompreFace).
#   4. Adapter les valeurs de script.placard_reglages ci-dessous (entités météo, TTS, adresse CompreFace).
#   5. Créer le dossier /media/placard (Studio Code Server ou Samba).
#
# Les photos vont dans /media/placard : ce dossier n'est pas servi sans authentification,
# contrairement à /config/www.

shell_command:
  # Renvoie le JSON de CompreFace (visages trouvés et personnes reconnues).
  placard_reconnaitre: >-
    curl -s -m 10 -X POST -H "x-api-key: {{ cle }}"
    -F "file=@{{ photo }}"
    "{{ url }}/api/v1/recognition/recognize?limit=1&prediction_count=1&det_prob_threshold=0.8"
  # Ajoute la photo comme exemple du visage de « personne ».
  placard_apprendre: >-
    curl -s -m 10 -X POST -H "x-api-key: {{ cle }}"
    -F "file=@{{ photo }}"
    "{{ url }}/api/v1/recognition/faces?subject={{ personne }}&det_prob_threshold=0.8"

script:
  placard_reglages:
    alias: "Placard : réglages"
    description: "Renvoie les réglages communs aux scripts du placard."
    sequence:
      - variables:
          reglages:
            camera: camera.camera_placard_camera
            lecteur: media_player.camera_placard_haut_parleur
            eclairage: light.camera_placard_eclairage
            # Entité météo du jour (Met.no : weather.forecast_maison ou weather.forecast_home).
            meteo: weather.forecast_maison
            # Moteur de synthèse vocale : tts.google_translate_fr_fr, tts.piper, tts.home_assistant_cloud…
            tts: tts.google_translate_fr_fr
            # Entité « Tâche IA » pour inventer un compliment (laisser vide pour la liste fixe).
            ia: ""
            # CompreFace : module complémentaire (port 8000) ou conteneur Docker sur une autre machine.
            compreface_url: "http://localhost:8000"
            photo: /media/placard/derniere.jpg
            # Similarité minimale pour reconnaître quelqu'un (0 à 1).
            seuil: 0.92
      - stop: "Réglages"
        response_variable: reglages

  placard_parler:
    alias: "Placard : parler"
    description: "Fait parler le haut-parleur du placard."
    mode: queued
    fields:
      message:
        description: Texte à prononcer.
        example: "Bonjour !"
        required: true
        selector:
          text:
    sequence:
      - action: script.placard_reglages
        response_variable: r
      - action: tts.speak
        target:
          entity_id: "{{ r.tts }}"
        data:
          media_player_entity_id: "{{ r.lecteur }}"
          message: "{{ message }}"
          language: fr

  placard_qui_est_la:
    alias: "Placard : qui est là ?"
    description: >-
      Prend jusqu'à 6 photos et renvoie le nom reconnu, « inconnu » (visage non reconnu)
      ou « personne » (aucun visage).
    mode: single
    sequence:
      - action: script.placard_reglages
        response_variable: r
      - variables:
          cle: !secret compreface_cle_api
          resultat: personne
      - repeat:
          count: 6
          sequence:
            - action: camera.snapshot
              target:
                entity_id: "{{ r.camera }}"
              data:
                filename: "{{ r.photo }}"
            - action: shell_command.placard_reconnaitre
              data:
                cle: "{{ cle }}"
                photo: "{{ r.photo }}"
                url: "{{ r.compreface_url }}"
              response_variable: reponse
              continue_on_error: true
            - variables:
                json: "{{ (reponse | default({})).get('stdout', '{}') | from_json(default={}) }}"
                visages: "{{ json.get('result', []) if json is mapping else [] }}"
                sujet: "{{ (visages[0].subjects | default([]) | first | default({})) if visages | count > 0 else {} }}"
                resultat: >-
                  {{ 'personne' if visages | count == 0
                     else (sujet.subject | lower if sujet.get('similarity', 0) | float(0) >= r.seuil
                     else 'inconnu') }}
            # Un visage reconnu arrête la boucle ; un inconnu laisse encore une chance.
            - if:
                - condition: template
                  value_template: "{{ resultat not in ['personne', 'inconnu'] }}"
              then:
                - variables:
                    retour:
                      qui: "{{ resultat }}"
                - stop: "Reconnu"
                  response_variable: retour
              else:
                - delay: 1
      # « resultat » garde la valeur du dernier essai (portée des variables de Home Assistant 2025.4+).
      - variables:
          retour:
            qui: "{{ resultat }}"
      - stop: "Fin"
        response_variable: retour

  placard_meteo:
    alias: "Placard : météo du jour"
    description: "Dit la météo du jour."
    sequence:
      - action: script.placard_reglages
        response_variable: r
      - action: weather.get_forecasts
        target:
          entity_id: "{{ r.meteo }}"
        data:
          type: daily
        response_variable: previsions
      - variables:
          jour: "{{ previsions[r.meteo].forecast[0] }}"
          libelles:
            clear-night: "une nuit claire"
            cloudy: "un ciel couvert"
            exceptional: "une météo exceptionnelle"
            fog: "du brouillard"
            hail: "de la grêle"
            lightning: "de l'orage"
            lightning-rainy: "de l'orage et de la pluie"
            partlycloudy: "un temps partiellement nuageux"
            pouring: "de fortes pluies"
            rainy: "de la pluie"
            snowy: "de la neige"
            snowy-rainy: "de la neige fondue"
            sunny: "du soleil"
            windy: "du vent"
            windy-variant: "du vent et des nuages"
          message: >-
            {% set c = libelles.get(jour.condition, jour.condition) %}
            {% set mini = jour.templow | default(none) %}
            {% set maxi = jour.temperature | default(none) %}
            {% set pluie = jour.precipitation_probability | default(none) %}
            Bonjour Alexis ! Aujourd'hui, {{ c }}
            {%- if mini is not none and maxi is not none %}, entre {{ mini | round(0) | int }} et {{ maxi | round(0) | int }} degrés
            {%- elif maxi is not none %}, {{ maxi | round(0) | int }} degrés au maximum{% endif %}.
            {% if pluie is not none %}Risque de pluie : {{ pluie | int }} pour cent.{% endif %}
            {% if (pluie | int(0)) >= 50 or jour.condition in ['rainy', 'pouring', 'lightning-rainy'] %}Prends un parapluie.{% endif %}
            {% if maxi is not none and maxi | float < 10 %}Couvre-toi bien, il fait frais.{% elif maxi is not none and maxi | float > 28 %}Habille-toi léger, il va faire chaud.{% endif %}
            Bonne journée !
      - action: script.placard_parler
        data:
          message: "{{ message }}"

  placard_compliment:
    alias: "Placard : compliment pour Marie"
    description: "Dit un compliment à Marie : inventé par l'IA si elle est réglée, sinon tiré de la liste."
    sequence:
      - action: script.placard_reglages
        response_variable: r
      - variables:
          phrases:
            - "Bonjour Marie ! Tu es ravissante aujourd'hui."
            - "Tu sais qu'Alexis t'aime fort ?"
            - "J'aimerais être ton amoureux, mais la place est déjà prise par Alexis."
            - "Mais quelle bombe !"
            - "Ce placard s'illumine dès que tu l'ouvres."
            - "Bonjour à la plus belle femme de la maison."
            - "Ton sourire réchauffe la maison mieux que le chauffage."
            - "Alexis a vraiment beaucoup de chance."
            - "Attention, ta beauté va faire fondre mes circuits."
            - "Peu importe la tenue que tu choisis, tu seras magnifique."
            - "Tu rayonnes ce matin, Marie."
            - "Même le soleil est jaloux de ton éclat."
            - "Je garde tes vêtements bien rangés, mais c'est toi qui les rends beaux."
            - "Tes yeux brillent plus que toutes mes lumières."
            - "Marie, tu es la reine de ce dressing."
            - "Si la beauté était un crime, tu serais condamnée à perpétuité."
            - "Je ne suis qu'un placard, mais je sais reconnaître une star."
            - "Alexis m'a chargé de te dire qu'il pense à toi."
            - "Tu es encore plus belle qu'hier, et pourtant c'était difficile."
            - "Bonne journée, ma princesse."
            - "Avec toi, chaque matin est un défilé de mode."
            - "Mon objectif n'a jamais rien vu d'aussi beau."
            - "Élégante, drôle et pétillante : le trio parfait, c'est toi."
            - "Je suis fan. Officiellement fan."
            - "Tu es la personne préférée d'Alexis. Et la mienne aussi."
            - "Waouh. Je n'ai pas d'autre mot. Waouh."
            - "Ce que tu vas porter aujourd'hui t'ira à merveille, comme toujours."
            - "Fais attention en sortant, tu vas faire tourner les têtes."
            - "Tu illumines la maison plus que tous les panneaux solaires du monde."
            - "Si j'avais un cœur, il battrait pour toi. Mais il est à Alexis, désolé."
            - "Bonjour beauté ! Prête à éblouir tout le monde ?"
            - "Je t'ai gardé ta plus belle tenue, mais c'est toi la plus belle."
          phrase: "{{ phrases | random }}"
      - if:
          - condition: template
            value_template: "{{ r.ia | length > 0 }}"
        then:
          - action: ai_task.generate_data
            continue_on_error: true
            data:
              task_name: compliment placard
              entity_id: "{{ r.ia }}"
              instructions: >-
                Tu es le placard à vêtements, tendre et plein d'humour, d'Alexis et de Marie.
                Écris un seul compliment affectueux pour Marie qui ouvre le placard le matin,
                en français, une ou deux phrases courtes faites pour être lues à voix haute,
                sans emoji. Tu peux rappeler qu'Alexis l'aime. Exemple de ton : « {{ phrase }} »
            response_variable: generation
          - variables:
              phrase: >-
                {{ generation.data if generation is defined and generation.data is string
                   and generation.data | length > 0 else phrase }}
      - action: script.placard_parler
        data:
          message: "{{ phrase }}"

  placard_apprendre_visage:
    alias: "Placard : apprendre un visage"
    description: >-
      Prend une photo et l'ajoute à CompreFace pour la personne choisie.
      À lancer 5 à 10 fois, placard ouvert, en bougeant un peu la tête.
    fields:
      personne:
        description: Nom de la personne dans CompreFace.
        required: true
        selector:
          select:
            options: [Alexis, Marie]
    sequence:
      - action: script.placard_reglages
        response_variable: r
      - action: light.turn_on
        target:
          entity_id: "{{ r.eclairage }}"
      - delay: 1
      - action: camera.snapshot
        target:
          entity_id: "{{ r.camera }}"
        data:
          filename: "{{ r.photo }}"
      - action: shell_command.placard_apprendre
        data:
          cle: !secret compreface_cle_api
          photo: "{{ r.photo }}"
          url: "{{ r.compreface_url }}"
          personne: "{{ personne }}"
        response_variable: reponse
      - action: persistent_notification.create
        data:
          notification_id: placard_apprentissage
          title: "Placard : apprentissage"
          message: "{{ personne }} : {{ reponse.stdout | default('pas de réponse') }}"

automation:
  - id: placard_accueil_du_matin
    alias: "Placard : accueil du matin"
    description: >-
      Porte du placard ouverte entre 7 h et 9 h : météo pour Alexis, compliment pour Marie,
      mise en garde pour un inconnu.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.camera_placard_porte
        from: "off"
        to: "on"
    conditions:
      - condition: time
        after: "07:00:00"
        before: "09:00:00"
      # Pas plus d'un accueil toutes les 2 minutes.
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or now() - this.attributes.last_triggered > timedelta(minutes=2) }}
    actions:
      # Laisse l'éclairage s'allumer et l'exposition de la caméra se régler.
      - delay:
          milliseconds: 800
      - action: script.placard_qui_est_la
        response_variable: visiteur
      - choose:
          - conditions: "{{ visiteur.qui == 'alexis' }}"
            sequence:
              - action: script.placard_meteo
          - conditions: "{{ visiteur.qui == 'marie' }}"
            sequence:
              - action: script.placard_compliment
          - conditions: "{{ visiteur.qui == 'inconnu' }}"
            sequence:
              - action: script.placard_parler
                data:
                  message: >-
                    {{ [
                      "Hé ! Tu n'as rien à faire dans ce placard. Referme la porte, s'il te plaît.",
                      "Je ne te connais pas. Ce placard est réservé à Alexis et Marie.",
                      "Accès refusé ! Tu n'as rien à faire ici."
                    ] | random }}
        # « personne » : aucun visage vu, le placard reste muet.
