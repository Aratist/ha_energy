title: Analyse énergie
views:
- title: Aujourd'hui
  path: aujourd-hui
  icon: mdi:white-balance-sunny
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Bilan depuis 6 h ce matin
      icon: mdi:scale-balance
    - type: markdown
      content: '{% set a=states(''sensor.gestionnaire_d_energie_autoconsommation_du_jour'')|float(0) %}{% set s=states(''sensor.gestionnaire_d_energie_soutirage_du_jour'')|float(0)
        %}{% set i=states(''sensor.gestionnaire_d_energie_injection_du_jour'')|float(0) %}Depuis 6 h ce matin, le
        soleil a couvert **{{ (a/(a+s)*100)|round if a+s>0 else 0 }} %** des besoins de la maison{% if a+i>0 %}
        et **{{ (a/(a+i)*100)|round }} %** de la production a été utilisée sur place{% endif %}.{% if i>0.5 %} {{
        i|round(1)|string|replace(''.'','','') }} kWh sont partis au réseau sans être payés.{% endif %}'
      grid_options:
        columns: full
      text_only: true
    - type: tile
      entity: sensor.gestionnaire_d_energie_cout_reseau_du_jour
      name: Payé au réseau
      grid_options:
        columns: 3
      vertical: true
      icon: mdi:cash-minus
      color: red
    - type: tile
      entity: sensor.gestionnaire_d_energie_economie_solaire_du_jour
      name: Économisé
      grid_options:
        columns: 3
      vertical: true
      icon: mdi:piggy-bank
      color: green
    - type: tile
      entity: sensor.gestionnaire_d_energie_soutirage_du_jour
      name: Acheté
      grid_options:
        columns: 3
      vertical: true
      icon: mdi:transmission-tower-import
      color: red
    - type: tile
      entity: sensor.gestionnaire_d_energie_autoconsommation_du_jour
      name: Soleil utilisé
      grid_options:
        columns: 3
      vertical: true
      icon: mdi:solar-power
      color: amber
    column_span: 2
  - type: grid
    cards:
    - type: heading
      heading: Puissances du jour
      icon: mdi:chart-areaspline
    - type: markdown
      content: '**Jaune** : ce que produisent les panneaux. **Bleu** : ce que consomme la maison. **Rouge** : le
        réseau — au-dessus de zéro on achète, en dessous le soleil est en trop. Pointillé : prévision solaire.'
      grid_options:
        columns: full
      text_only: true
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      header:
        show: true
        title: Production, consommation et réseau
        show_states: true
        colorize_states: true
      graph_span: 24h
      span:
        start: day
      now:
        show: true
        label: Maintenant
      yaxis:
      - decimals: 0
      apex_config:
        chart:
          height: 340
        legend:
          show: true
        fill:
          type: gradient
          gradient:
            opacityFrom: 0.55
            opacityTo: 0.05
      all_series_config:
        stroke_width: 2
        curve: smooth
        float_precision: 0
        group_by:
          func: avg
          duration: 10min
      series:
      - entity: sensor.gestionnaire_d_energie_production_solaire
        name: Production
        type: area
        color: '#f5b400'
      - entity: sensor.gestionnaire_d_energie_consommation
        name: Consommation
        type: area
        color: '#3b82f6'
      - entity: sensor.gestionnaire_d_energie_puissance_reseau
        name: Réseau (+ import / − export)
        type: line
        color: '#e53935'
      - entity: sensor.power_production_now
        name: Prévision solaire
        type: line
        color: '#9e9e9e'
        stroke_dash: 6
        show:
          in_header: false
    column_span: 2
  - type: grid
    cards:
    - type: heading
      heading: Qui a tourné, et pourquoi
      icon: mdi:timeline-clock
    - type: history-graph
      hours_to_show: 24
      grid_options:
        columns: full
      title: 'Appareils pilotés : en marche'
      entities:
      - entity: switch.chauffe_eau_prise_1
        name: Chauffe-eau
      - entity: switch.piscine_prise_1
        name: Piscine
      - entity: binary_sensor.clim_bas_allumee
        name: Clim du bas
      - entity: sensor.gestionnaire_d_energie_tarif_actuel
        name: Tarif
    - type: history-graph
      hours_to_show: 24
      grid_options:
        columns: full
      title: Pourquoi le gestionnaire a décidé ainsi
      entities:
      - entity: sensor.gestionnaire_d_energie_etat_chauffe_eau
        name: Chauffe-eau
      - entity: sensor.gestionnaire_d_energie_etat_piscine
        name: Piscine
      - entity: sensor.gestionnaire_d_energie_etat_clim
        name: Clim du bas
    - type: markdown
      content: Touche une barre pour lire la raison exacte à cette heure-là.
      grid_options:
        columns: full
      text_only: true
    column_span: 2
  - type: grid
    cards:
    - type: heading
      heading: Autres appareils
      icon: mdi:power-plug
    - type: markdown
      content: '« En marche » d''après la puissance mesurée : une prise toujours allumée n''apparaît que quand l''appareil
        consomme vraiment. **Sans capteur** : voiture la nuit (≈ 4 kW en continu), plaques ou four aux heures des
        repas.'
      grid_options:
        columns: full
      text_only: true
    - type: history-graph
      hours_to_show: 24
      grid_options:
        columns: full
      title: 'Autres appareils : en marche'
      entities:
      - entity: binary_sensor.machine_a_laver_en_marche
        name: Machine à laver
      - entity: binary_sensor.jacuzzi_en_chauffe
        name: Jacuzzi (chauffe)
      - entity: binary_sensor.grille_pain_en_marche
        name: Grille-pain
      - entity: binary_sensor.imprimante_3d_en_marche
        name: Imprimante 3D
      - entity: switch.prise_lampe_3dprinter
        name: Lampe imprimante 3D
      - entity: binary_sensor.pompe_dehors_devant_en_marche
        name: Pompe dehors devant
      - entity: binary_sensor.pompe_interrupteur_en_marche
        name: Pompe (interrupteur)
      - entity: binary_sensor.clim_haut_allumee
        name: Clim du haut
      - entity: binary_sensor.appareils_sans_capteur_en_marche
        name: Sans capteur (voiture, cuisson)
    column_span: 2
- title: Historique
  path: historique
  icon: mdi:calendar-range
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Argent
      icon: mdi:cash
    - type: markdown
      content: 'Une « journée » va de **6 h à 6 h** : elle inclut la nuit en heures creuses qui suit. **Rouge**
        : facture du réseau. **Vert** : ce que le soleil a évité de payer.'
      grid_options:
        columns: full
      text_only: true
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      header:
        show: true
        title: Payé au réseau et économisé par le soleil (€ / journée, 14 jours)
        show_states: true
        colorize_states: true
      graph_span: 14d
      span:
        end: day
        offset: +6h
      yaxis:
      - min: 0
        decimals: 2
      apex_config:
        chart:
          height: 260
        legend:
          show: true
        plotOptions:
          bar:
            borderRadius: 4
            columnWidth: 70%
      all_series_config:
        type: column
        float_precision: 2
        group_by:
          func: max
          duration: 1d
      series:
      - entity: sensor.gestionnaire_d_energie_cout_reseau_du_jour
        name: Coût réseau
        color: '#e53935'
      - entity: sensor.gestionnaire_d_energie_economie_solaire_du_jour
        name: Économie solaire
        color: '#43a047'
    - type: tile
      entity: sensor.gestionnaire_d_energie_economie_solaire_de_la_semaine
      name: Économie de la semaine
      grid_options:
        columns: 4
      vertical: true
      icon: mdi:calendar-week
      color: green
    - type: tile
      entity: sensor.gestionnaire_d_energie_economie_solaire_du_mois
      name: Économie du mois
      grid_options:
        columns: 4
      vertical: true
      icon: mdi:calendar-month
      color: green
    - type: tile
      entity: sensor.gestionnaire_d_energie_economie_solaire_de_l_annee
      name: Économie de l'année
      grid_options:
        columns: 4
      vertical: true
      icon: mdi:calendar
      color: green
    column_span: 2
  - type: grid
    cards:
    - type: heading
      heading: Énergie
      icon: mdi:lightning-bolt
    - type: markdown
      content: 'Plus la part **soleil utilisé** est grande, mieux c''est. L''**injection** est du soleil perdu (non
        payé) : c''est elle que le gestionnaire cherche à réduire.'
      grid_options:
        columns: full
      text_only: true
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      header:
        show: true
        title: D'où vient l'énergie (kWh / journée, 14 jours)
      graph_span: 14d
      span:
        end: day
      stacked: true
      yaxis:
      - decimals: 1
      apex_config:
        chart:
          height: 300
        legend:
          show: true
        plotOptions:
          bar:
            borderRadius: 3
            columnWidth: 70%
      all_series_config:
        type: column
        float_precision: 1
        statistics:
          type: change
          period: day
          align: start
      series:
      - entity: sensor.gestionnaire_d_energie_autoconsommation_du_jour
        name: Autoconsommation
        color: '#f5b400'
      - entity: sensor.gestionnaire_d_energie_soutirage_du_jour
        name: Soutirage
        color: '#3b82f6'
      - entity: sensor.gestionnaire_d_energie_injection_du_jour
        name: Injection (en négatif)
        color: '#43a047'
        invert: true
    column_span: 2
- title: Solaire
  path: solaire
  icon: mdi:solar-power-variant
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Production par jour
      icon: mdi:solar-power-variant
    - type: markdown
      content: Compare ce que les panneaux ont **réellement produit** à ce que la météo **prévoyait**. Un écart
        régulier se corrige avec le « facteur de correction » dans les réglages.
      grid_options:
        columns: full
      text_only: true
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      header:
        show: true
        title: Production réelle et prévision (kWh / jour, 10 jours)
      graph_span: 10d
      span:
        end: day
      yaxis:
      - min: 0
        decimals: 1
      apex_config:
        chart:
          height: 300
        legend:
          show: true
        plotOptions:
          bar:
            borderRadius: 4
            columnWidth: 70%
      series:
      - entity: sensor.izypower_cloud_maison_production_jour
        name: Production réelle
        type: column
        color: '#f5b400'
        float_precision: 1
        statistics:
          type: change
          period: day
          align: start
      - entity: sensor.energy_production_today
        name: Prévision
        type: column
        color: '#9e9e9e'
        opacity: 0.6
        float_precision: 1
        group_by:
          func: last
          duration: 1d
  - type: grid
    cards:
    - type: heading
      heading: Taux du jour
      icon: mdi:percent-circle
    - type: markdown
      content: '**Jaune** : part de la production utilisée sur place (le reste est injecté gratuitement). **Vert**
        : part des besoins de la maison couverts par le soleil.'
      grid_options:
        columns: full
      text_only: true
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      chart_type: radialBar
      header:
        show: true
        title: Part du solaire aujourd'hui
      apex_config:
        chart:
          height: 300
        legend:
          show: true
          position: bottom
        plotOptions:
          radialBar:
            hollow:
              size: 45%
      series:
      - entity: sensor.gestionnaire_d_energie_autoconsommation_du_jour
        name: Production consommée sur place
        color: '#f5b400'
        unit: '%'
        float_precision: 0
        max: 100
        transform: 'const a = parseFloat(x); const i = parseFloat(hass.states[''sensor.gestionnaire_d_energie_injection_du_jour''].state);
          return a + i > 0 ? a / (a + i) * 100 : 0;'
      - entity: sensor.gestionnaire_d_energie_autoconsommation_du_jour
        name: Besoins couverts par le solaire
        color: '#43a047'
        unit: '%'
        float_precision: 0
        max: 100
        transform: 'const a = parseFloat(x); const s = parseFloat(hass.states[''sensor.gestionnaire_d_energie_soutirage_du_jour''].state);
          return a + s > 0 ? a / (a + s) * 100 : 0;'
  - type: grid
    cards:
    - type: heading
      heading: Micro-onduleurs
      icon: mdi:solar-panel
    - type: markdown
      content: Une courbe nettement plus basse que les autres signale un panneau à l'ombre, sale ou en défaut.
      grid_options:
        columns: full
      text_only: true
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      header:
        show: true
        title: Production par panneau (W, aujourd'hui)
      graph_span: 24h
      span:
        start: day
      stacked: true
      apex_config:
        chart:
          height: 300
        legend:
          show: true
      all_series_config:
        type: area
        curve: smooth
        stroke_width: 1
        opacity: 0.7
        float_precision: 0
        group_by:
          func: avg
          duration: 15min
      series:
      - entity: sensor.izypower_cloud_maison_milieu_serie_milieu_izypower_cloud_maison_milieu_serie_milieu_pv1
        name: Milieu 1
        color: '#ffd54f'
      - entity: sensor.izypower_cloud_maison_milieu_serie_milieu_izypower_cloud_maison_milieu_serie_milieu_pv2
        name: Milieu 2
        color: '#ffb300'
      - entity: sensor.izypower_cloud_maison_bord_maison_serie_bord_maison_izypower_cloud_maison_bord_maison_serie_bord_maison_pv1
        name: Bord maison 1
        color: '#ff8a65'
      - entity: sensor.izypower_cloud_maison_bord_maison_serie_bord_maison_izypower_cloud_maison_bord_maison_serie_bord_maison_pv2
        name: Bord maison 2
        color: '#f4511e'
      - entity: sensor.izypower_cloud_maison_bord_cheminee_serie_bord_cheminee_izypower_cloud_maison_bord_cheminee_serie_bord_cheminee_pv1
        name: Bord cheminée 1
        color: '#aed581'
      - entity: sensor.izypower_cloud_maison_bord_cheminee_serie_bord_cheminee_izypower_cloud_maison_bord_cheminee_serie_bord_cheminee_pv2
        name: Bord cheminée 2
        color: '#7cb342'
- title: Appareils
  path: appareils
  icon: mdi:power-plug-outline
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Puissance des appareils
      icon: mdi:flash
    - type: markdown
      content: Qui consomme, et quand. Le chauffe-eau (≈ 2,4 kW) et la clim sont les plus gros postes pilotés.
      grid_options:
        columns: full
      text_only: true
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      header:
        show: true
        title: Puissance par appareil (W, 24 h)
        show_states: true
        colorize_states: true
      graph_span: 24h
      stacked: true
      apex_config:
        chart:
          height: 320
        legend:
          show: true
      all_series_config:
        type: area
        curve: smooth
        stroke_width: 1
        opacity: 0.7
        float_precision: 0
        group_by:
          func: avg
          duration: 10min
      series:
      - entity: sensor.chauffe_eau_puissance
        name: Chauffe-eau
        color: '#ef6c00'
      - entity: sensor.piscine_puissance
        name: Piscine
        color: '#00acc1'
      - entity: sensor.puissance_clim_bas
        name: Clim bas
        color: '#5c6bc0'
      - entity: sensor.prise_sdb_bas_puissance
        name: Jacuzzi
        color: '#8e24aa'
      - entity: sensor.priseboiteaulettre_puissance
        name: Machine à laver
        color: '#78909c'
      - entity: sensor.prise_imprimante_puissance
        name: Imprimante 3D
        color: '#6d4c41'
      - entity: sensor.prise_lampe_imprimante_puissance
        name: Lampe imprimante 3D
        color: '#fdd835'
      - entity: sensor.prisepompe_puissance
        name: Prise dehors devant (pompe)
        color: '#26a69a'
      - entity: sensor.grille_pain_prise_deconnectee_puissance
        name: Grille-pain
        color: '#d81b60'
      - entity: sensor.switch_pompe_puissance
        name: Pompe (interrupteur)
        color: '#8d6e63'
      - entity: sensor.recharge_voiture_estimee
        name: Recharge voiture (estimée)
        color: '#7e57c2'
      - entity: sensor.cuisine_estimee
        name: Cuisine (estimée)
        color: '#c2185b'
  - type: grid
    cards:
    - type: heading
      heading: Voiture et cuisine (estimées)
      icon: mdi:car-electric
    - type: markdown
      content: 'Ces appareils n''ont pas de capteur : leur consommation est **déduite du Linky** (ce qu''il mesure
        moins les appareils connus).


        - **Recharge voiture** : entre 22 h et 6 h, quand ni le chauffe-eau ni la clim ne tournent, toute consommation
        non expliquée d''au moins 1,5 kW.

        - **Cuisine** : entre 12 h et 14 h et entre 18 h 30 et 20 h 30, quand la consommation non expliquée dépasse
        3 kW (plaques, four).


        Une recharge pendant que le chauffe-eau chauffe n''est pas comptée. Historique reconstitué depuis le 13
        novembre.'
      grid_options:
        columns: full
      text_only: true
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      header:
        show: true
        title: Recharge voiture par nuit (kWh, 14 nuits)
        show_states: false
      graph_span: 14d
      span:
        end: day
        offset: +12h
      yaxis:
      - min: 0
        decimals: 0
      apex_config:
        chart:
          height: 260
        plotOptions:
          bar:
            borderRadius: 4
            columnWidth: 70%
        dataLabels:
          enabled: true
      series:
      - entity: sensor.recharge_voiture_energie
        name: Recharge voiture
        type: column
        color: '#7e57c2'
        float_precision: 1
        statistics:
          type: change
          period: hour
          align: start
        group_by:
          func: sum
          duration: 1d
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      header:
        show: true
        title: Cuisine par jour (kWh, 14 jours)
        show_states: false
      graph_span: 14d
      span:
        end: day
      yaxis:
      - min: 0
        decimals: 1
      apex_config:
        chart:
          height: 260
        plotOptions:
          bar:
            borderRadius: 4
            columnWidth: 70%
      series:
      - entity: sensor.cuisine_energie
        name: Cuisine
        type: column
        color: '#c2185b'
        float_precision: 1
        statistics:
          type: change
          period: day
          align: start
    column_span: 2
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Énergie par jour
      icon: mdi:calendar-month
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      header:
        show: true
        title: Énergie par appareil (kWh / jour, 14 jours)
      graph_span: 14d
      span:
        end: day
      stacked: true
      apex_config:
        chart:
          height: 320
        legend:
          show: true
        plotOptions:
          bar:
            borderRadius: 3
            columnWidth: 70%
      all_series_config:
        type: column
        float_precision: 2
        statistics:
          type: change
          period: day
          align: start
      series:
      - entity: sensor.chauffe_eau_energie_jour
        name: Chauffe-eau
        color: '#ef6c00'
      - entity: sensor.piscine_energie_jour
        name: Piscine
        color: '#00acc1'
      - entity: sensor.daikinap85642_climatecontrol_heating_daily_electrical_consumption
        name: Clim bas (chauffage)
        color: '#5c6bc0'
      - entity: sensor.daikinap85642_climatecontrol_cooling_daily_electrical_consumption
        name: Clim bas (froid)
        color: '#90caf9'
      - entity: sensor.prise_sdb_bas_consommation
        name: Jacuzzi
        color: '#8e24aa'
      - entity: sensor.priseboiteaulettre_consommation
        name: Machine à laver
        color: '#78909c'
      - entity: sensor.prise_imprimante_summation_delivered
        name: Imprimante 3D
        color: '#6d4c41'
      - entity: sensor.prise_lampe_imprimante_consommation
        name: Lampe imprimante 3D
        color: '#fdd835'
      - entity: sensor.prisepompe_summation_delivered
        name: Prise dehors devant (pompe)
        color: '#26a69a'
      - entity: sensor.grille_pain_prise_deconnectee_summation_delivered
        name: Grille-pain
        color: '#d81b60'
      - entity: sensor.switch_pompe_consommation
        name: Pompe (interrupteur)
        color: '#8d6e63'
      - entity: sensor.recharge_voiture_energie
        name: Recharge voiture (estimée)
        color: '#7e57c2'
      - entity: sensor.cuisine_energie
        name: Cuisine (estimée)
        color: '#c2185b'
  - type: grid
    cards:
    - type: heading
      heading: Répartition du mois
      icon: mdi:chart-donut
    - type: custom:apexcharts-card
      grid_options:
        columns: full
      chart_type: donut
      header:
        show: true
        title: Énergie du mois en cours (kWh)
      graph_span: 1month
      span:
        start: month
      apex_config:
        chart:
          height: 320
        legend:
          show: true
          position: bottom
      all_series_config:
        float_precision: 1
        statistics:
          type: change
          period: month
          align: start
      series:
      - entity: sensor.chauffe_eau_energie_jour
        name: Chauffe-eau
        color: '#ef6c00'
      - entity: sensor.piscine_energie_jour
        name: Piscine
        color: '#00acc1'
      - entity: sensor.daikinap85642_climatecontrol_heating_daily_electrical_consumption
        name: Clim bas (chauffage)
        color: '#5c6bc0'
      - entity: sensor.daikinap85642_climatecontrol_cooling_daily_electrical_consumption
        name: Clim bas (froid)
        color: '#90caf9'
      - entity: sensor.prise_sdb_bas_consommation
        name: Jacuzzi
        color: '#8e24aa'
      - entity: sensor.priseboiteaulettre_consommation
        name: Machine à laver
        color: '#78909c'
      - entity: sensor.prise_imprimante_summation_delivered
        name: Imprimante 3D
