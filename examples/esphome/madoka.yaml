# ESP32 relais Bluetooth pour la télécommande Daikin Madoka (BRC1H).
# Intégration Home Assistant : "Daikin Madoka" (HACS), https://github.com/dasimon135/daikin_madoka
#
# À adapter avant de flasher :
#   1. board : le modèle de votre ESP32 (esp32dev convient à la plupart des cartes génériques).
#   2. mac_address : l'adresse lue dans le menu Bluetooth de la télécommande.
#   3. secrets.yaml d'ESPHome : madoka_api_key, madoka_ota_password.
#
# Wi-Fi : au premier démarrage, l'ESP32 ouvre le point d'accès "Madoka Fallback".
# Connectez-vous-y depuis un téléphone et choisissez votre réseau dans la page qui s'ouvre
# (ou via https://web.esphome.io en USB). Les identifiants restent dans l'ESP32.
#
# Placez l'ESP32 dans la même pièce que la télécommande.

substitutions:
  madoka_mac: "AC:EB:51:C6:88:B3"

esphome:
  name: madoka-relais
  friendly_name: Relais Madoka

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret madoka_api_key

ota:
  - platform: esphome
    password: !secret madoka_ota_password

wifi:
  ap:
    ssid: "Madoka Fallback"

captive_portal:

web_server:
  port: 80
  version: 3

improv_serial:

external_components:
  - source:
      type: git
      url: https://github.com/dasimon135/daikin_madoka
      ref: v3.14.1
      path: esphome/components
    components: [madoka, madoka_base]

esp32_ble:
  io_capability: display_yes_no

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 30ms
    active: true

ble_client:
  - mac_address: ${madoka_mac}
    id: madoka_ble
    on_numeric_comparison_request:
      then:
        # Affiche le code dans Home Assistant pour le comparer à l'écran de la télécommande.
        # Nécessite "Autoriser l'appareil à effectuer des actions Home Assistant"
        # dans les options de l'appareil ESPHome ; sans cela l'appairage fonctionne quand même.
        - homeassistant.action:
            action: persistent_notification.create
            data:
              notification_id: madoka_appairage
              title: "Appairage Madoka"
              message: !lambda 'return "Code sur la télécommande : " + str_sprintf("%06u", passkey);'
        - ble_client.numeric_comparison_reply:
            id: madoka_ble
            accept: true
    on_disconnect:
      then:
        - delay: 10s
        - ble_client.connect: madoka_ble

climate:
  - platform: madoka
    name: "Clim Madoka"
    ble_client_id: madoka_ble
    update_interval: 15s

sensor:
  - platform: wifi_signal
    name: "Signal Wi-Fi"
    update_interval: 60s
