# ESP32-C3 branché sur la prise TIC du compteur Linky (mode standard, 9600 bauds).
# Il n'utilise pas le Wi-Fi : il envoie ses mesures en ESP-NOW à la passerelle
# (linky-passerelle.yaml), qui les publie dans Home Assistant.
#
# À adapter avant de flasher :
#   1. mac_passerelle : l'adresse MAC de la passerelle, lue dans ses journaux au démarrage
#      ou sur la page de l'appareil dans Home Assistant (Informations de connexion).
#   2. canal_wifi : le canal Wi-Fi de la box, que la passerelle suit. Le fixer dans la box :
#      en canal automatique, un changement de canal coupe la liaison.
#   3. secrets.yaml d'ESPHome : linky_espnow_cle, identique sur les deux ESP32.
#
# Sans Wi-Fi, pas de mise à jour par le réseau : se flashe en USB.
# Ne pas ajouter de bloc wifi: : la recherche de réseau change de canal et coupe l'ESP-NOW.

substitutions:
  mac_passerelle: "20:E7:C8:67:BB:A4"
  canal_wifi: "6"

esphome:
  name: linky-tic
  friendly_name: Linky TIC

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

espnow:
  id: espnow_linky
  channel: ${canal_wifi}
  peers:
    - ${mac_passerelle}

# Envoi en unicast : la passerelle acquitte chaque trame et l'ESP32 la renvoie si besoin.
# Toutes les valeurs sont renvoyées à chaque intervalle : une trame perdue est rattrapée.
packet_transport:
  - platform: espnow
    espnow_id: espnow_linky
    peer_address: ${mac_passerelle}
    update_interval: 10s
    encryption: !secret linky_espnow_cle
    rolling_code_enable: true
    sensors:
      - easf01
      - easf02
      - easf03
      - easf04
      - easf05
      - easf06
      - sinsts
      - sinsts1
      - sinsts2
      - sinsts3
      - ccasn
      - ntarf
      - stge_haut
      - stge_bas
      - temps_marche

uart:
  id: uart_bus
  rx_pin: GPIO20
  baud_rate: 9600
  parity: EVEN
  data_bits: 7
  stop_bits: 1

teleinfo:
  update_interval: 10s
  historical_mode: false

sensor:
  # Index d'énergie soutirée par période tarifaire (kWh).
  - platform: teleinfo
    tag_name: "EASF01"
    id: easf01
    filters:
      - multiply: 0.001
  - platform: teleinfo
    tag_name: "EASF02"
    id: easf02
    filters:
      - multiply: 0.001
  - platform: teleinfo
    tag_name: "EASF03"
    id: easf03
    filters:
      - multiply: 0.001
  - platform: teleinfo
    tag_name: "EASF04"
    id: easf04
    filters:
      - multiply: 0.001
  - platform: teleinfo
    tag_name: "EASF05"
    id: easf05
    filters:
      - multiply: 0.001
  - platform: teleinfo
    tag_name: "EASF06"
    id: easf06
    filters:
      - multiply: 0.001
  # Puissance apparente instantanée soutirée, totale puis par phase (VA).
  - platform: teleinfo
    tag_name: "SINSTS"
    id: sinsts
  - platform: teleinfo
    tag_name: "SINSTS1"
    id: sinsts1
  - platform: teleinfo
    tag_name: "SINSTS2"
    id: sinsts2
  - platform: teleinfo
    tag_name: "SINSTS3"
    id: sinsts3
  # Point de la courbe de charge active soutirée (W).
  - platform: teleinfo
    tag_name: "CCASN"
    id: ccasn
  # Numéro de l'index tarifaire en cours : la passerelle en refait le libellé.
  - platform: teleinfo
    tag_name: "NTARF"
    id: ntarf
  - platform: uptime
    id: temps_marche
    update_interval: 10s
  # Registre de statuts coupé en deux moitiés de 16 bits : un float ne garde pas 32 bits exacts.
  - platform: template
    id: stge_haut
    update_interval: never
  - platform: template
    id: stge_bas
    update_interval: never

text_sensor:
  - platform: teleinfo
    tag_name: "STGE"
    id: stge
    on_value:
      then:
        - lambda: |-
            uint32_t registre = strtoul(x.c_str(), nullptr, 16);
            id(stge_haut).publish_state(registre >> 16);
            id(stge_bas).publish_state(registre & 0xFFFF);
