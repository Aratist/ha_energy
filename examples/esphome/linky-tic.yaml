# ESP32-C3 branché sur la prise TIC du compteur Linky (mode standard, 9600 bauds).
# Il ne se connecte à aucun réseau Wi-Fi : il envoie ses mesures en ESP-NOW à la passerelle
# (linky-passerelle.yaml), qui les publie dans Home Assistant.
#
# À adapter avant de flasher :
#   1. mac_passerelle : l'adresse MAC de la passerelle, lue dans ses journaux au démarrage
#      ou sur la page de l'appareil dans Home Assistant (Informations de connexion).
#   2. canal_wifi : le canal Wi-Fi de la box, que la passerelle suit. Le fixer dans la box :
#      en canal automatique, un changement de canal coupe la liaison.
#   3. secrets.yaml d'ESPHome : linky_espnow_cle, identique sur les deux ESP32, et
#      linky_tic_ap_mdp, mot de passe de son point d'accès.
#
# Sans connexion à la box, pas de mise à jour par le réseau : se flashe en USB.
# Ne pas ajouter de networks: au bloc wifi: : la recherche de réseau change de canal et coupe
# l'ESP-NOW.

substitutions:
  mac_passerelle: "20:E7:C8:67:BB:A4"
  canal_wifi: "6"

esphome:
  name: linky-tic
  friendly_name: Linky TIC

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

# Point d'accès seul, sur le canal de l'ESP-NOW : jamais de recherche de réseau, qui changerait
# de canal. Se connecter au réseau « Linky TIC » près du compteur, puis ouvrir http://192.168.4.1.
wifi:
  ap:
    ssid: "Linky TIC"
    password: !secret linky_tic_ap_mdp
    channel: ${canal_wifi}

web_server:
  version: 3

espnow:
  id: espnow_linky
  channel: ${canal_wifi}
  peers:
    - ${mac_passerelle}

# Envoi en unicast : la passerelle acquitte chaque trame et l'ESP32 la renvoie si besoin.
# Toutes les valeurs sont renvoyées à chaque intervalle : une trame perdue est rattrapée.
packet_transport:
  - platform: espnow
    espnow_id: espnow_linky
    peer_address: ${mac_passerelle}
    update_interval: 10s
    encryption: !secret linky_espnow_cle
    rolling_code_enable: true
    sensors:
      - sinsts
      - temps_marche

uart:
  id: uart_bus
  rx_pin: GPIO20
  baud_rate: 9600
  parity: EVEN
  data_bits: 7
  stop_bits: 1

teleinfo:
  update_interval: 10s
  historical_mode: false

sensor:
  # Puissance apparente instantanée soutirée, toutes phases (VA).
  - platform: teleinfo
    tag_name: "SINSTS"
    id: sinsts
    name: "Consommation instantanée"
  # Temps de marche : la passerelle s'en sert pour savoir que la liaison fonctionne.
  - platform: uptime
    id: temps_marche
    name: "Temps de marche"
    update_interval: 10s
