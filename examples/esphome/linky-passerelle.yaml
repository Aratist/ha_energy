# ESP32 passerelle : reçoit en ESP-NOW les mesures du module Linky (linky-tic.yaml)
# et les publie dans Home Assistant par le Wi-Fi.
#
# Carte prévue : l'ancien ESP32 répéteur Wi-Fi du jardin. Il doit capter la box directement
# (vers −75 dBm au plus) : c'est lui qui porte le Wi-Fi, l'ESP-NOW ne couvre que le trajet
# jusqu'au compteur. S'il capte mal, le rapprocher de la maison, pas du compteur.
# Ne pas utiliser le relais Madoka ni le relais Tesla : le Bluetooth partage la même radio.
#
# Une seule mesure du compteur est publiée : la consommation instantanée (puissance
# apparente soutirée, SINSTS). Le reste n'est que diagnostic de la liaison.
#
# À adapter :
#   1. board : esp32dev pour un ESP32 classique, esp32-c3-devkitm-1 pour un ESP32-C3.
#   2. secrets.yaml d'ESPHome : linky_espnow_cle, identique sur les deux ESP32.
# Le premier flash se fait en USB (https://web.esphome.io) : l'ancien firmware de répéteur
# n'accepte pas les mises à jour d'ESPHome.
# Le canal Wi-Fi de la box apparaît dans les journaux à la connexion ("Channel: ...") :
# le reporter dans canal_wifi de linky-tic.yaml.

substitutions:
  mac_linky: "88:56:A6:70:70:E4"

esphome:
  name: linky-passerelle
  friendly_name: Linky

esp32:
  # Nom écrit en clair : ESPHome Builder lit la carte sans remplacer les substitutions.
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ap: {}
  # Un seul réseau : l'ESP-NOW suit le canal du point d'accès, et le module Linky
  # n'émet que sur canal_wifi (6). Un autre réseau (Freebox-38A244, canal 2) couperait la liaison.
  networks:
    - ssid: !secret wifi_ssid2
      password: !secret wifi_password2
  # Indispensable : en veille Wi-Fi, la radio manque des trames ESP-NOW.
  power_save_mode: NONE

captive_portal:

web_server:
  version: 3

espnow:
  id: espnow_passerelle
  peers:
    - ${mac_linky}

packet_transport:
  - platform: espnow
    espnow_id: espnow_passerelle
    peer_address: ${mac_linky}
    providers:
      - name: linky-tic
        encryption: !secret linky_espnow_cle

globals:
  - id: dernier_message
    type: uint32_t
    initial_value: "0"

binary_sensor:
  # Allumé tant que le module Linky envoie des mesures.
  - platform: template
    name: "Status"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(dernier_message) != 0 && millis() - id(dernier_message) < 60000;

button:
  - platform: restart
    name: "Redémarrage passerelle"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    unit_of_measurement: dB
    device_class: signal_strength
    accuracy_decimals: 0
    update_interval: 60s

  # Puissance apparente instantanée soutirée (VA), toutes phases.
  - platform: packet_transport
    provider: linky-tic
    remote_id: sinsts
    internal: false
    name: "Consommation instantanée"
    unit_of_measurement: VA
    state_class: measurement
    device_class: apparent_power

  # Temps de marche du module : chaque réception prouve que la liaison fonctionne.
  - platform: packet_transport
    provider: linky-tic
    remote_id: temps_marche
    id: temps_marche
    on_value:
      then:
        - lambda: id(dernier_message) = millis();

text_sensor:
  - platform: wifi_info
    ip_address:
      name: Linky IP Address
    ssid:
      name: "Réseau Wi-Fi"
      entity_category: diagnostic
    scan_results:
      name: "Réseaux visibles"
      entity_category: diagnostic
